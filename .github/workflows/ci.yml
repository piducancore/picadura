name: CI
on:
  push:
    branches: [main]
    paths-ignore: ['site/**', '**.md', 'docs/picadura.png']
  pull_request:
    paths-ignore: ['site/**', '**.md', 'docs/picadura.png']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  plugins:
    uses: ./.github/workflows/build.yml
